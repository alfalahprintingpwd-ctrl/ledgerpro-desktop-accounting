name: Build LedgerPro Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build

      - name: Build Windows EXE
        run: npx electron-builder --win

      - name: Upload LedgerPro EXE
        uses: actions/upload-artifact@v4
        with:
          name: LedgerPro-Windows
          path: release/*.exe
